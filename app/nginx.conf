server {
  listen 80;
  root /usr/share/nginx/html;

  # Redirect root to app
  location = / {
    return 301 /entedit/;
  }

  # SPA — serve index.html for all unknown paths under /entedit/
  location /entedit/ {
    try_files $uri $uri/ /entedit/index.html;
  }

  # SPARQL traffic: proxied untouched, so responses stay compressed.
  # Longer prefix than /graphdb/ below, so nginx matches this first.
  location /graphdb/repositories/ {
    proxy_pass         http://graphdb:7200/repositories/;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  # Proxy /graphdb/* → GraphDB container (mirrors the Vite dev proxy).
  #
  # The GraphDB Workbench serves <base href="/">, so its relative assets would
  # resolve against the site root and 404 when it is served under /graphdb/.
  # Rewriting the tag to the origin-relative /graphdb/ keeps it correct for any
  # hostname the app is reached by — unlike graphdb.external-url, which would
  # have to name one. Accept-Encoding must be cleared, because GraphDB gzips its
  # HTML and sub_filter cannot read a compressed body.
  location /graphdb/ {
    proxy_pass         http://graphdb:7200/;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_read_timeout 60s;

    proxy_set_header   Accept-Encoding "";
    sub_filter '<base href="/"' '<base href="/graphdb/"';
    sub_filter_once on;
  }
}
