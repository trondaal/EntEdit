services:
  graphdb:
    image: ontotext/graphdb:10.8.12
    ports:
      - "7200:7200"
    volumes:
      - graphdb-data:/opt/graphdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7200/rest/repositories"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  graphdb-init:
    # Data, repository config and import script are baked into this image, so
    # nothing is mounted from the source tree — `docker compose up` works from
    # Docker Hub alone. `build` lets maintainers rebuild it after changing
    # anything under database/ or docker/graphdb/; to iterate without
    # rebuilding, add -f docker-compose.dev.yml to mount the local files.
    image: trondaal/entedit-init:latest
    build:
      context: .
      dockerfile: docker/init/Dockerfile
    environment:
      - GRAPHDB_URL=http://graphdb:7200
      - GRAPHDB_REPO=EntEdit
      # Set FORCE_REINIT=1 (e.g. via Docker Desktop) and restart this
      # container to wipe all repository data + connectors and re-import
      # from scratch. Leave unset for normal startups — the script will
      # detect the init marker and skip re-initialization.
      - FORCE_REINIT=${FORCE_REINIT:-0}
    depends_on:
      graphdb:
        condition: service_healthy
    restart: "no"

  web:
    image: trondaal/entedit:latest
    # `build` lets `docker compose build` produce the publishable image locally;
    # `docker compose up` pulls the published image by default.
    build: ./app
    ports:
      - "80:80"
    depends_on:
      graphdb:
        condition: service_healthy

volumes:
  graphdb-data:
