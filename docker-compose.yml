# No `build` sections here: `docker compose publish` pushes the local image of
# every service that has one, which replaced the multi-arch `latest` images with
# single-platform builds. Builds live in docker-compose.dev.yml; release images
# are built with `docker buildx` (see ADVANCED.md).

services:
  graphdb:
    image: ontotext/graphdb:10.8.12
    # Host ports can be changed when 80 or 7200 is already taken on the
    # machine, e.g. ENTEDIT_PORT=8080 docker compose ... up -d. The app needs
    # no other setting: its endpoint and the Workbench link follow its origin.
    ports:
      - target: 7200
        published: "${GRAPHDB_PORT:-7200}"
    volumes:
      - graphdb-data:/opt/graphdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7200/rest/repositories"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  graphdb-init:
    # Data, repository config and import script are baked into this image, so
    # nothing is mounted from the source tree — `docker compose up` works from
    # Docker Hub alone. To iterate on database/ or docker/graphdb/ without
    # rebuilding, add -f docker-compose.dev.yml to mount the local files.
    image: trondaal/entedit-init:latest
    environment:
      - GRAPHDB_URL=http://graphdb:7200
      - GRAPHDB_REPO=EntEdit
      # Set FORCE_REINIT=1 (e.g. via Docker Desktop) and restart this
      # container to wipe all repository data + connectors and re-import
      # from scratch. Leave unset for normal startups — the script will
      # detect the init marker and skip re-initialization.
      - FORCE_REINIT=${FORCE_REINIT:-0}
    depends_on:
      graphdb:
        condition: service_healthy
    restart: "no"

  web:
    image: trondaal/entedit:latest
    ports:
      - target: 80
        published: "${ENTEDIT_PORT:-80}"
    depends_on:
      graphdb:
        condition: service_healthy

volumes:
  graphdb-data:
